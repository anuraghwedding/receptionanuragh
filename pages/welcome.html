<section
    class="grand-wedding-scene"
    id="grandWeddingScene"
    aria-hidden="true"
>

    <img
        class="grand-wedding-image"
        src="./public/images/invitation/wedding-opening-scene.png"
        alt="Lord Ganesha and wedding invitation"
    >


    <div class="grand-wedding-overlay"></div>


    <div
        class="grand-scene-particles"
        id="grandSceneParticles"
        aria-hidden="true"
    ></div>


    <div class="grand-scene-content">

        <div class="grand-scene-symbol">
            ✦
        </div>

        <p>
            A STORY OF LOVE
        </p>

        <span>
            BEGINS HERE
        </span>

    </div>


    <div class="grand-scroll-indicator">

        <span>
            SCROLL TO BEGIN THEIR STORY
        </span>

        <div class="grand-scroll-line">
            <i></i>
        </div>

    </div>

</section>
