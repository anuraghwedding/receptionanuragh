<section class="meet-couple" id="meetCouple">

    <!-- Background -->
    <div class="wedding-glow"></div>

    <!-- Intro -->
    <div class="couple-intro">
        <span class="intro-line"></span>

        <p>OUR BEAUTIFUL JOURNEY</p>

        <h1>Meet the Couple</h1>

        <span class="intro-heart">♡</span>
    </div>


    <!-- Photo Burst -->
    <div class="burst-container"></div>


    <!-- Floating petals -->
    <div class="petals-container"></div>


    <!-- FINAL COUPLE -->
    <div class="couple-final">


        <!-- =========================
             BRIDE
        ========================== -->

        <div class="person bride">

            <div class="portrait-frame">

                <div class="gold-frame"></div>

                <div class="flower-decoration flower-left">
                    ✦
                </div>

                <img
                    src="./public/images/couple/bride.webp"
                    alt="Anusua"
                >

            </div>


            <div class="person-info">

                <span class="person-label">
                    THE BRIDE
                </span>

                <h2>Anusua</h2>

                <div class="name-decoration">
                    <span></span>
                    ♥
                    <span></span>
                </div>

            </div>

        </div>



        <!-- =========================
             CENTER HEART
        ========================== -->

        <div class="heart-area">

            <!-- Sparkles -->
            <span class="sparkle sparkle-1">✦</span>
            <span class="sparkle sparkle-2">✧</span>
            <span class="sparkle sparkle-3">✦</span>
            <span class="sparkle sparkle-4">·</span>
            <span class="sparkle sparkle-5">✧</span>


            <!-- 3D Heart -->
            <div class="heart-3d">

                <div class="heart-glow"></div>

                <div class="heart-shape">

                    <div class="heart-inner"></div>

                    <div class="heart-highlight"></div>

                </div>

                <!-- Gold orbit -->
                <div class="heart-orbit"></div>

                <div class="heart-orbit orbit-2"></div>

            </div>


            <!-- Center text -->
            <div class="heart-caption">

                <span>TWO SOULS</span>

                <strong>ONE JOURNEY</strong>

            </div>


        </div>



        <!-- =========================
             GROOM
        ========================== -->

        <div class="person groom">

            <div class="portrait-frame">

                <div class="gold-frame"></div>

                <div class="flower-decoration flower-right">
                    ✦
                </div>

                <img
                    src="./public/images/couple/groom.webp"
                    alt="Raghvendra"
                >

            </div>


            <div class="person-info">

                <span class="person-label">
                    THE GROOM
                </span>

                <h2>Raghvendra</h2>

                <div class="name-decoration">
                    <span></span>
                    ♥
                    <span></span>
                </div>

            </div>

        </div>


    </div>

</section>
