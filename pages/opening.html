<section class="diya-opening" id="welcome">

    <div class="diya-background">

        <div class="diya-vignette"></div>

        <div class="diya-glow-background"></div>

        <div class="diya-moon-glow"></div>

    </div>

    <div class="diya-reveal-bg" aria-hidden="true">
        <img
            src="./public/open.jpeg"
            alt=""
        >
    </div>

    <div
        class="diya-particles"
        id="diyaParticles"
        aria-hidden="true"
    ></div>

    <div
        class="diya-mandala"
        aria-hidden="true"
    >

        <div class="diya-mandala-ring ring-one"></div>

        <div class="diya-mandala-ring ring-two"></div>

        <div class="diya-mandala-ring ring-three"></div>

        <div class="diya-mandala-center">
            ॐ
        </div>

    </div>

    <div class="diya-content">

        <div
            class="diya-intro"
            id="diyaIntro"
        >

            <div class="diya-top-symbol">
                ✦
            </div>

            <p class="diya-intro-small">
                A BEAUTIFUL BEGINNING
            </p>

            <p class="diya-intro-blessing">
                ॥ श्री गणेशाय नमः ॥
            </p>

            <div class="diya-small-line"></div>

            <p class="diya-instruction">
                LIGHT THE FLAME
            </p>

            <p class="diya-instruction-sub">
                and begin the story of
            </p>
            <span class="diya-couple-name">AnuRagh</span>

        </div>

        <button
            class="diya-holder"
            id="diyaHolder"
            type="button"
            aria-label="Light the wedding diya"
        >

            <span class="diya-flame-glow"></span>

            <span
                class="diya-flame"
                id="diyaFlame"
            >
                <span class="diya-flame-inner"></span>
            </span>

            <span class="diya-wick"></span>

            <span class="diya-bowl">

                <span class="diya-oil"></span>

                <span class="diya-bowl-highlight"></span>

            </span>

            <span class="diya-plate">

                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </span>

        </button>
        <div class="diya-click-hint" id="diyaClickHint">

    <span class="diya-click-hint-main">
        TAP THE DIYA
    </span>

    <span class="diya-click-hint-sub">
        to begin their story
    </span>

</div>

        <div
            class="diya-reveal"
            id="diyaReveal"
        >

            <button
                class="diya-enter"
                id="diyaEnter"
                type="button"
                aria-label="Enter our story"
            >
                <b>→</b>
            </button>

        </div>

    </div>

    <div class="diya-bottom">

        <span>
            WITH LOVE
        </span>

        <i></i>

        <span>
            2026
        </span>

    </div>

    <div
        class="diya-light-burst"
        id="diyaLightBurst"
    ></div>

</section>
