    <style>
        /* Background-music toggle — only shown once the main site loads */
        #musicToggle {
            position: fixed;
            bottom: 22px;
            right: 22px;
            z-index: 999;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid rgba(232, 188, 99, .6);
            background: rgba(20, 12, 8, .78);
            color: #e8bc63;
            font-size: 18px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
            backdrop-filter: blur(4px);
            transition: transform .25s ease, background .25s ease;
        }

        #musicToggle.is-visible {
            display: flex;
        }

        #musicToggle:hover {
            transform: scale(1.08);
        }

        #musicToggle .music-icon {
            display: inline-block;
            animation: musicSpin 3.5s linear infinite;
            animation-play-state: paused;
        }

        #musicToggle.is-playing .music-icon {
            animation-play-state: running;
        }

        @keyframes musicSpin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
